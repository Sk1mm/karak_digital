# ===========================================================================
# FORMULAS (source: various GDDs)
# ===========================================================================

formulas:

  attack_total:
    source: combat-system.md
    expression: "dice_sum + attack_bonus + scroll_bonus + hp_bonus + first_step_bonus"
    variables:
      dice_sum: {range: "2–12", source: dice-system.md}
      attack_bonus: {range: "0–6", source: player-state.md}  # max 2×axe = 3+3
      scroll_bonus: {range: "0–3", source: item-database.md}  # max 3×scroll_magic_attack = 1+1+1
      hp_bonus: {range: "0–1", source: class-system.md}       # Warlock only
      first_step_bonus: {range: "0–1", source: class-system.md}  # Oracle only
    output_range: "2–23"  # theoretical; practical per-class max = 22
    referenced_by: [player-state.md, item-database.md, monster-database.md, dice-system.md]

  player_wins:
    source: monster-database.md
    expression: "attack_total > difficulty"
    note: "strict greater than; tie (==) = loss without damage (except Rogue wins_on_draw)"
    referenced_by: [combat-system.md]

  vp_winner:
    source: win-condition.md
    expression: "winner = argmax(player.vp); tie-break = dragon_killer"
    referenced_by: [player-state.md, combat-system.md, loot-system.md]

  inventory_capacity:
    source: item-database.md
    expression: "capacity = {WEAPON: 2, KEY: 1, SCROLL: 3}"
    referenced_by: [player-state.md, loot-system.md]

  bypass_cost_valkyrie:
    source: class-system.md
    expression: "remaining_steps = steps_remaining - 2; player_hp -= 1"
    note: "unavailable if steps_remaining < 2 or hp == 1"
    referenced_by: [movement-system.md]

  swap_cost_warlock:
    source: class-system.md
    expression: "remaining_steps = steps_remaining - 4"
    note: "unavailable if steps_remaining < 4"
    referenced_by: [movement-system.md]

